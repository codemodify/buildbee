# Postgres 16 + BuildBee Server.
# From the repo root:
#   docker compose -f deploy/compose/docker-compose.yml up --build
# Optional Artifact object-storage stub:
#   docker compose -f deploy/compose/docker-compose.yml --profile extras up

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: buildbee
      POSTGRES_PASSWORD: buildbee
      POSTGRES_DB: buildbee
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildbee -d buildbee"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: ../../server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      BUILDBEE_ADDR: ":8080"
      DATABASE_URL: postgres://buildbee:buildbee@postgres:5432/buildbee?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  # Optional later: Artifact object storage. Not required for the Server stub.
  minio:
    profiles: ["extras"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: buildbee
      MINIO_ROOT_PASSWORD: buildbee-minio
    ports:
      - "9000:9000"
      - "9001:9001"

volumes:
  postgres_data:

# BuildBee on one LAN host: Postgres + Server (+ an optional agent for a Bot).
#
# From the repo root:
#   docker compose -f deploy/compose/docker-compose.yml up --build
#   BUILDBEE_BOT=<bot id> docker compose -f deploy/compose/docker-compose.yml --profile agent up --build
#
# Only the Server is published; Postgres stays on the compose network.
# Workers open no port: they pull Runs from the Server.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: buildbee
      POSTGRES_PASSWORD: ${BUILDBEE_DB_PASSWORD:-buildbee}
      POSTGRES_DB: buildbee
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildbee -d buildbee"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  server:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "${BUILDBEE_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://buildbee:${BUILDBEE_DB_PASSWORD:-buildbee}@postgres:5432/buildbee?sslmode=disable
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
    volumes:
      - server_data:/data   # attachments and large Artifacts (BUILDBEE_BLOB_DIR)
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # An agent running the fake AI, for demos and the smoke test. Agents
  # that run real AIs (claude, codex, ...) run on machines where those CLIs
  # are logged in: see docs/agents.md. BUILDBEE_BOT is the Bot it runs,
  # from Add bot in # status.
  agent:
    profiles: ["agent"]
    build:
      context: ../..
      dockerfile: Dockerfile.agent
    environment:
      BUILDBEE_URL: http://server:8080
      BUILDBEE_BOT: ${BUILDBEE_BOT:-}   # the Bot this agent runs; buildbee-agent refuses to start without it
      BUILDBEE_AI: ${BUILDBEE_AI:-fake}
      BUILDBEE_AGENT_HOST: ${BUILDBEE_AGENT_HOST:-compose}
      BUILDBEE_SLOTS: ${BUILDBEE_SLOTS:-4}
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  server_data:

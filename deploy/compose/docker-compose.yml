# BuildBee on one LAN host: Postgres + Server (+ optional worker).
#
# From the repo root:
#   docker compose -f deploy/compose/docker-compose.yml up --build
#   docker compose -f deploy/compose/docker-compose.yml --profile worker up --build
#
# Only the Server is published; Postgres stays on the compose network.
# Workers open no port: they pull Runs from the Server.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: buildbee
      POSTGRES_PASSWORD: ${BUILDBEE_DB_PASSWORD:-buildbee}
      POSTGRES_DB: buildbee
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildbee -d buildbee"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  server:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "${BUILDBEE_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://buildbee:${BUILDBEE_DB_PASSWORD:-buildbee}@postgres:5432/buildbee?sslmode=disable
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
    volumes:
      - server_data:/data   # attachments and large Artifacts (BUILDBEE_BLOB_DIR)
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # A worker offering the fake agent, for demos and the smoke test. Workers
  # that run real agents (claude, codex, ...) run on machines where those
  # CLIs are logged in: see docs/workers.md.
  worker:
    profiles: ["worker"]
    build:
      context: ../..
      dockerfile: Dockerfile.worker
    environment:
      BUILDBEE_URL: http://server:8080
      BUILDBEE_WORKER_NAME: ${BUILDBEE_WORKER_NAME:-compose-worker}
      BUILDBEE_WORKER_AGENTS: fake
      BUILDBEE_WORKER_SLOTS: ${BUILDBEE_WORKER_SLOTS:-4}
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  server_data:

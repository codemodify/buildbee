# Railway: deploy the Server from the repo root.
# Compose remains the self-host source of truth (deploy/compose).
#
#   railway.toml at repo root copies this file, or set:
#     railway up --service buildbee-server
#
# Required / common variables (set in the Railway environment):
#   DATABASE_URL          Railway Postgres plugin (migrations run on boot)
#   PORT                  set by Railway (Server also reads BUILDBEE_ADDR)
#   SESSION_SECRET        cookie signing when GitHub OAuth is enabled
#   GITHUB_CLIENT_ID      optional; omit for dev auth
#   GITHUB_CLIENT_SECRET
#   GITHUB_OAUTH_REDIRECT https://<your-domain>/v1/auth/callback
#   GITHUB_TOKEN          optional Repo PR / Issues sync
#   GITHUB_REPO           owner/name
#   GITHUB_WEBHOOK_SECRET optional HMAC on Issues/Pipelines webhooks
#   BUILDBEE_FRONTEND_URL public web origin if hosted separately

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

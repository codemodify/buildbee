[package]
name = "buildbee"
version = "0.1.0"
description = "BuildBee desktop shell — wraps the web UI and talks to a Server"
authors = ["BuildBee"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "buildbee_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
